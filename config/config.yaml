max_threads: 4

data:
  base_root: "data"
  ssu:
   fasta: https://www.arb-silva.de/fileadmin/silva_databases/release_144/Exports/SILVA_144_SSUParc_tax_silva_trunc.fasta.gz
   tax: https://www.arb-silva.de/fileadmin/silva_databases/release_144/Exports/taxonomy/taxmap_slv_ssu_parc_144.txt.gz
  lsu:
   fasta: https://www.arb-silva.de/fileadmin/silva_databases/release_138_2/Exports/SILVA_138.2_LSUParc_tax_silva.fasta.gz
   tax: https://www.arb-silva.de/fileadmin/silva_databases/release_138_2/Exports/taxonomy/taxmap_slv_lsu_parc_138.2.txt.gz
  trees:
   - Quercus
   - Tilia
   - Betula
   - Populus
   - Fraxinus
   - Alnus
  dirs:
    raw: "raw"

workflow:
  base_root: "workflow"
  dirs:
    rules: "rules"
    scripts: "scripts"
    lib: "lib"
    envs: 'envs'

output:
  base_root: "output"
  dirs:
    fungi_aln: "fungi_aln"
    tree_aln: "tree_aln"

